[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tactics"
version = "0.4.0"
description = "A goal-driven agent framework whose tactics learn from outcomes and snap together."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Monsoud Zanaty" }]
dependencies = []

[project.scripts]
tactics = "tactics.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.4"]
llm = ["anthropic>=0.40"]
agent-sdk = ["claude-agent-sdk>=0.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
